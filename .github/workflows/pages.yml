# The alternative to GoDaddy: publish to GitHub Pages instead.
#
# The site is hosted on GoDaddy, so this does not run on its own -- start it
# by hand from the Actions tab if you ever want a free copy on
# signarama2023.github.io/memorymugco, for staging or as a fallback.
#
# It needs one setting first, which only a repository admin can make and no
# workflow can make for you: Settings -> Pages -> Build and deployment ->
# Source -> "GitHub Actions".
name: Deploy to GitHub Pages (manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run finish rather than cancelling it; a half-deployed site is worse
# than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repository root. index.html is the site; the extras
          # alongside it are small and harmless to serve.
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
