# Publishes the site on every push to main.
#
# memorymugco.com is a GoDaddy domain pointed here; the hosting is GitHub
# Pages, which is free and renews its own certificate. The CNAME file in this
# repository is what keeps the custom domain set across deploys.
#
# One setting has to be made by hand first, by a repository admin, and no
# workflow can make it for you:
#
#   Settings -> Pages -> Build and deployment -> Source -> "GitHub Actions"
#
# Until that is set, this workflow runs and fails at the deploy step. That is
# the right way round: a site is never published from a setting nobody chose.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run finish rather than cancelling it; a half-deployed site is worse
# than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repository root. index.html is the site; the extras
          # alongside it are small and harmless to serve.
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
