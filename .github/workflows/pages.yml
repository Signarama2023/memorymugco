# Publishes the site on every push to main.
#
# memorymugco.com is a GoDaddy domain pointed here; the hosting is GitHub
# Pages, which is free and renews its own certificate. The CNAME file in this
# repository is what keeps the custom domain set across deploys.
#
# One setting has to be made by hand first, by a repository admin:
#
#   Settings -> Pages -> Build and deployment -> Source -> "GitHub Actions"
#
# No workflow can do it for you. configure-pages has an `enablement` input
# that creates the site through the API, and it was tried here: the Actions
# token is refused with "Create Pages site failed. Resource not accessible by
# integration", because enabling Pages is an administration permission that
# GITHUB_TOKEN does not carry. So the input is left off rather than kept as a
# step that always fails.
#
# Until the source is set, this workflow fails on configure-pages with
# "Get Pages site failed ... Not Found". That is the only thing standing
# between this repository and a live site.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run finish rather than cancelling it; a half-deployed site is worse
# than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repository root. index.html is the site; the extras
          # alongside it are small and harmless to serve.
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
