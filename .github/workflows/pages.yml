# Publishes the site on every push to main.
#
# memorymugco.com is a GoDaddy domain pointed here; the hosting is GitHub
# Pages, which is free and renews its own certificate. The CNAME file in this
# repository is what keeps the custom domain set across deploys.
#
# It switches Pages on for the repository itself the first time it runs
# (`enablement: true` below), so there is no setting to go and find first.
# That is only appropriate because publishing this site is the whole point of
# the repository; it is not something to copy into a repo where a deploy
# should wait for a human.
#
# If that step is ever refused -- Pages needs the repository to be public on a
# free plan -- the fallback is one field by hand:
# Settings -> Pages -> Build and deployment -> Source -> "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run finish rather than cancelling it; a half-deployed site is worse
# than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
        with:
          # Creates the Pages site on the first run instead of failing
          # with "Get Pages site failed ... Not Found".
          enablement: true
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repository root. index.html is the site; the extras
          # alongside it are small and harmless to serve.
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
