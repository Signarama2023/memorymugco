# Publishes the site to GoDaddy over FTPS whenever main changes.
#
# It does nothing until the credentials exist, so it is safe to merge before
# you have set them up. To turn it on, add these under
# Settings -> Secrets and variables -> Actions -> Secrets:
#
#   FTP_SERVER     the FTP host from cPanel, e.g. ftp.memorymugco.com
#   FTP_USERNAME   the FTP account's username
#   FTP_PASSWORD   its password
#
# And, if the site does not live in public_html, add a Variable (not a secret)
# named FTP_DIR with the right path.
#
# Make a dedicated FTP account in cPanel scoped to public_html rather than
# using the main cPanel login: a leaked deploy password should cost you one
# folder, not the whole hosting account.
name: Deploy to GoDaddy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: godaddy-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - id: check
        name: Are the credentials set?
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$SERVER" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Nothing was deployed"
              echo
              echo "No \`FTP_SERVER\` secret is set, so there is nowhere to upload to."
              echo "**memorymugco.com is unchanged.** This run is green because it had"
              echo "nothing to do, not because the site went live."
              echo
              echo "To turn deploys on, add \`FTP_SERVER\`, \`FTP_USERNAME\` and"
              echo "\`FTP_PASSWORD\` under Settings -> Secrets and variables -> Actions."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Only index.html is served. Building the payload explicitly keeps the
      # README, this workflow and tools/ off a public web root.
      - name: Assemble what actually gets served
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p site
          cp index.html site/

      - name: Upload
        if: steps.check.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ vars.FTP_DIR || 'public_html/' }}
          local-dir: ./site/

      - name: Say what went out
        if: steps.check.outputs.ready == 'true'
        run: |
          {
            echo "### Deployed"
            echo
            echo "\`index.html\` uploaded to \`${{ vars.FTP_DIR || 'public_html/' }}\` on \`${{ secrets.FTP_SERVER }}\`."
          } >> "$GITHUB_STEP_SUMMARY"
